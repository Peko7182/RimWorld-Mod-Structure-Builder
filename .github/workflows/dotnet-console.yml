name: .NET Console Application Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: "RimWorld Mod Structure Builder.sln"
      Project_Path: "RimWorld Mod Structure Builder.csproj"
      Runtime: "win-x64"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore "$env:Solution_Name"

    # Build and publish a single EXE
    - name: Publish application
      run: |
        dotnet publish "$env:Project_Path" \
          --configuration Release \
          --runtime $env:Runtime \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -o ./publish

    # Upload artifact
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: RimWorld-Mod-Structure-Builder
        path: ./publish

    # Create GitHub Release
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        artifacts: "publish/*.exe"
        token: ${{ secrets.GITHUB_TOKEN }}
